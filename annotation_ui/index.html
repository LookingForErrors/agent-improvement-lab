<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace review · Agent Improvement Lab</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Trace review"><span class="brand-icon">↗</span><span>Trace review<small>Agent Improvement Lab</small></span></a><div class="global-progress"><span id="progressText"></span><div class="progress-track"><div id="progressBar"></div></div></div><div class="top-actions"><button id="rulesButton" class="secondary" type="button"></button><button id="exportButton" class="secondary" type="button"></button><button id="themeButton" class="secondary" type="button" aria-pressed="false">Тёмная тема</button><button id="languageButton" class="language" type="button">EN</button></div></header>
<div id="fatal" class="fatal" role="alert" hidden></div>
<div class="workspace">
<aside class="queue"><div class="queue-heading"><h2 id="queueTitle"></h2><span id="queueCount" class="badge"></span></div><div class="queue-filters" role="group" aria-label="Queue filter"><button id="filterAll" class="active" data-filter="all"></button><button id="filterPending" data-filter="pending"></button><button id="filterReviewed" data-filter="reviewed"></button></div><div id="queueList" class="queue-list"></div></aside>
<main id="reader" tabindex="-1"><div class="trace-heading"><div><p id="traceKicker" class="eyebrow"></p><h1 id="traceTitle"></h1><p id="traceDescription" class="muted"></p></div><div class="reader-controls"><button id="previousButton" class="icon-button" aria-label="Previous trace">←</button><button id="nextButton" class="icon-button" aria-label="Next trace">→</button></div></div><div class="reader-note" id="readerNote"></div><div id="timeline"></div></main>
<aside id="annotationPanel" class="annotation"><div class="annotation-heading"><div><p id="annotationKicker" class="eyebrow"></p><h2 id="annotationTitle"></h2></div><span id="saveState" class="save-state" aria-live="polite"></span></div><form id="annotationForm"><label class="field-label" for="annotator" id="annotatorLabel"></label><input id="annotator" name="annotator" maxlength="80" value="" autocomplete="off"><fieldset class="verdict-field"><legend id="verdictLabel"></legend><label class="verdict-option correct"><input type="radio" name="verdict" value="correct"><span class="verdict-icon">✓</span><span id="correctText"></span></label><label class="verdict-option incorrect"><input type="radio" name="verdict" value="incorrect"><span class="verdict-icon">×</span><span id="incorrectText"></span></label><label class="verdict-option unassessable"><input type="radio" name="verdict" value="unassessable"><span class="verdict-icon">?</span><span id="unassessableText"></span></label></fieldset><div id="errorSection" hidden><p class="field-label" id="errorsLabel"></p><div id="errorTypes" class="error-types"></div></div><p class="field-label" id="evidenceLabel"></p><p class="hint" id="evidenceHint"></p><div id="evidenceList" class="evidence-list"></div><label class="field-label" for="comment" id="commentLabel"></label><textarea id="comment" rows="4" maxlength="8000"></textarea><div class="scenario-section"><label class="scenario-toggle"><input id="scenarioProblem" type="checkbox"><span id="scenarioLabel"></span></label><div id="scenarioDetails" hidden><p class="hint" id="scenarioHint"></p><div id="scenarioEvidenceList" class="evidence-list"></div><label class="field-label" for="scenarioComment" id="scenarioCommentLabel"></label><textarea id="scenarioComment" rows="3" maxlength="8000"></textarea></div></div></form><div class="annotation-footer"><div id="formMessage" role="alert" class="form-message" hidden></div><button id="reloadSavedButton" class="secondary full-width" type="button" hidden></button><div class="save-buttons"><button id="saveButton" class="secondary" type="button"></button><button id="saveNextButton" class="primary" type="submit" form="annotationForm"></button></div><p id="saveHelp" class="hint"></p></div></aside>
</div>
<button id="annotationJumpButton" class="annotation-jump" type="button"></button>
<dialog id="rulesDialog"><div class="dialog-heading"><h2 id="rulesTitle"></h2><button id="closeRules" class="icon-button" aria-label="Close">×</button></div><p class="muted" id="rulesHelp"></p><pre id="rulesText" class="rules-text"></pre></dialog>
</body></html>
